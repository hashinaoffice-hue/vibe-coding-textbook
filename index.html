 t:[['서비스','service|서비스','여러 사람이 계속 쓰는 앱과 그 운영까지'],['팀 공간','workspace|워크스페이스','여러 사람이 데이터를 함께 쓰는 단위. 이 책에서는 teams 표'],['리팩터링','refactoring|리팩터링','동작은 그대로 두고 코드 구조를 고치는 일']],
 e:['네 번의 버전','v5  팀 공간 · 초대 · 역할\nv6  파일 첨부 · 실시간 · 이메일 알림\nv7  AI 스트리밍 · 정해진 형식 · 품질 확인\nv8  에러 모니터링 · 백업 · 보안 점검']},
'0-3':{s:'실전에서는 새로 만들기보다 이미 있는 코드를 고치는 일이 많아요. 고치기 전에 AI에게 코드 지도를 받아요. 넓은 질문으로 시작해 좁혀 가고, 버튼 하나를 눌렀을 때 데이터가 어디로 흐르는지 따라가요.',
 p:['"아직 아무것도 고치지 마"를 붙이면 읽고 설명만 해요.','넓게(폴더 구조) → 좁게(기능 하나의 흐름) 순서로 물어요.','이해한 내용은 docs/map.md에 남겨 다음 대화에서도 써요.'],
 t:[['코드베이스','codebase|코드베이스','프로젝트의 코드 전체'],['데이터 흐름','data flow|데이터 플로우','입력이 화면에서 저장소까지 거치는 길'],['@ 참조','|앳 참조','@파일경로로 그 파일을 대화에 바로 넣는 방법']],
 e:['넓게 → 좁게','1. 이 프로젝트 구조를 한눈에 정리해줘\n2. 핵심 데이터 모델은 뭐야?\n3. 메모 저장을 화면부터 DB까지 따라가 줘\n4. @src/App.jsx 의 역할만 설명해줘'],
 w:['구조를 모른 채 "이 기능 추가해줘"부터 해요.','AI 설명을 그대로 믿어요. 근거가 되는 파일과 줄을 물어요.','긴 설명을 대화에만 두고 문서로 남기지 않아요.']},
'1-1':{s:'명세는 "누가, 무엇을, 왜"와 "언제 끝났는지"를 적은 문서예요. 사용자 이야기 한 줄과 완료 조건 몇 개면 충분해요. 완료 조건이 분명하면 AI도 나도 같은 목표를 보고 일해요.',
 p:['사용자 이야기: "팀원으로서, 회의 내용을 모으려고 팀 메모를 함께 보고 싶다."','완료 조건은 직접 확인할 수 있게 "~할 수 있다"로 써요.','하지 않을 것도 적어요. 범위가 좁아야 끝까지 가요.'],
 t:[['명세','specification|스펙','만들 것과 기준을 적은 문서'],['사용자 이야기','user story|유저 스토리','누가 무엇을 왜 원하는지 쓴 한 문장'],['완료 조건','acceptance criteria|억셉턴스 크라이테리아','끝났다고 볼 수 있는 확인 목록']],
 e:['v5 명세 예시','이야기: 팀원으로서 팀 메모를 함께 보고 싶다\n완료 조건\n- 팀을 만들고 이메일로 초대할 수 있다\n- 팀원만 팀 메모를 볼 수 있다\n하지 않을 것: 팀 여러 개 전환 (v6 이후)'],
 w:['완료 조건 없이 "팀 기능 만들어줘"라고만 해요.','"빠르게", "깔끔하게"처럼 확인할 수 없는 말로 조건을 써요.','하지 않을 것을 적지 않아 기능이 계속 늘어나요.']},
'1-2':{s:'화면 흐름은 화면과 화면 사이를 어떻게 오가는지 그린 지도예요. 손그림이나 상자 몇 개면 돼요. 데이터가 없을 때, 불러오는 중일 때, 실패했을 때의 모습을 정해 두면 AI가 빠뜨리지 않아요.',
 p:['정상 화면만 만들면 빈 화면과 에러에서 사용자가 길을 잃어요.','손그림을 사진으로 찍어 붙여도 AI가 읽어요.','화면마다 "여기서 할 수 있는 일"을 한 줄로 적어요.'],
 t:[['와이어프레임','wireframe|와이어프레임','색 없이 배치만 그린 화면 설계도'],['빈 상태','empty state|엠티 스테이트','보여 줄 데이터가 없을 때의 화면'],['로딩','loading|로딩','데이터를 불러오는 중인 상태']],
 e:['팀 메모 화면 흐름','로그인 → 팀 고르기 → 팀 메모 목록 → 메모 보기\n목록이 빔: "첫 메모를 써 보세요" + 버튼\n불러오는 중: 회색 줄 세 개\n실패: 이유 한 줄 + "다시 시도" 버튼']},
'1-3':{s:'데이터 모델은 어떤 표가 있고, 표끼리 어떻게 이어지는지 정한 것이에요. 팀 하나에 메모가 여럿이면 1:N이에요. 사람은 여러 팀에, 팀에는 여러 사람이 있으면 N:M이고, 가운데에 둘을 잇는 표를 둬요.',
 p:['1:N은 N쪽 표에 상대의 id를 적어요. 메모에 team_id를 두는 식이에요.','N:M은 연결 표를 만들어요. members에 team_id, user_id, 역할을 둬요.','데이터가 쌓인 뒤에는 표 구조를 바꾸기 어려워요.'],
 t:[['일대다','one-to-many|원 투 매니','한쪽 하나에 다른 쪽 여럿이 이어지는 관계(1:N)'],['다대다','many-to-many|매니 투 매니','양쪽 모두 여럿이 이어지는 관계(N:M)'],['외래 키','foreign key|포린 키','다른 표의 id를 가리키는 칸']],
 e:['팀 메모의 표','teams    id, name\nmembers  team_id, user_id, role\nmemos    id, team_id, author_id, body\n사람은 Supabase 로그인의 auth.users를 써요'],
 w:['메모 표에 팀원 이메일을 쉼표로 이어 적어요. 연결 표를 만들어요.','같은 정보를 두 표에 따로 적어서 한쪽만 바뀌어요.','AI가 만든 표를 읽지 않고 그대로 실행해요.']},
'1-4':{s:'API 약속은 화면이 무엇을 보내면 서버가 무엇을 돌려주는지 정한 것이에요. 미리 정해 두면 화면과 서버를 따로 만들어도 맞물려요. 성공할 때뿐 아니라 실패할 때 무엇을 돌려줄지도 정해요.',
 p:['요청: 어떤 주소로, 어떤 방식(GET · POST)으로, 무엇을 보내는지.','응답: 성공하면 어떤 모양을, 실패하면 어떤 에러를 돌려주는지.','에러 모양을 하나로 맞추면 화면에서 다루기 쉬워요.'],
 t:[['API','Application Programming Interface|에이피아이','프로그램끼리 주고받는 약속'],['요청 · 응답','request · response|리퀘스트 · 리스폰스','보내는 것과 돌려받는 것'],['상태 코드','status code|스테이터스 코드','결과를 알리는 숫자. 200 성공, 403 권한 없음 등']],
 e:['약속 예시','POST /api/summarize\n보냄  { memoId }\n성공  200 { summary }\n실패  403 { error: "팀원이 아니에요" }\n      429 { error: "잠시 후 다시 시도해요" }'],
 w:['성공할 때 모양만 정하고 에러는 그때그때 만들어요.','화면과 서버가 같은 값을 다른 이름으로 불러요(memoId, memo_id).','약속을 바꾸고 문서를 고치지 않아요.']},
'1-5':{s:'명세는 AI가 나를 인터뷰하게 해서 쓰면 빠르고 빠짐이 적어요. 생각지 못한 경우를 AI가 물어봐 줘요. 정리된 명세는 새 대화에서 구현할 때 넘겨요. 바꾸기 어려운 결정은 이유와 함께 따로 적어요.',
 p:['"나를 인터뷰해서 명세를 정해줘"로 시작해요.','명세가 끝나면 /clear로 대화를 비우고, 새 대화에서 명세를 주고 구현해요.','결정 기록은 "무엇을, 왜, 다른 선택지" 세 줄이면 돼요.'],
 t:[['인터뷰','interview|인터뷰','AI가 묻고 내가 답하며 요구를 모으는 방식'],['결정 기록','decision record|디시전 레코드','중요한 결정과 이유를 남긴 기록'],['/clear','|클리어','대화 내용을 비우고 새로 시작하는 명령']],
 e:['결정 기록 한 칸','결정: 팀원 관계는 members 표로 잇는다\n이유: 한 사람이 여러 팀에 들어갈 수 있다\n다른 선택지: memos에 팀원 목록 저장 (버림)']},
'2-1':{s:'계획 모드에서는 AI가 파일을 읽고 계획만 내놓아요. 내가 승인하기 전에는 아무것도 고치지 않아요. 여러 파일을 바꾸거나 방법이 확실하지 않을 때 써요. 한 문장으로 설명되는 작은 수정은 바로 맡겨도 돼요.',
 p:['Shift+Tab을 눌러 상태 줄에 plan mode가 보이면 켜진 거예요.','계획에서 바뀌는 파일 · 순서 · 확인 방법을 꼭 읽어요.','Ctrl+G로 계획을 편집기에서 직접 고친 뒤 승인할 수 있어요.'],
 t:[['계획 모드','plan mode|플랜 모드','읽고 계획만 세우는 모드. 승인 전엔 고치지 않아요'],['Shift+Tab','|시프트 탭','권한 모드를 차례로 바꾸는 단축키'],['구현','implementation|임플리멘테이션','계획을 실제 코드로 만드는 일']],
 e:['계획을 읽을 때 볼 것','□ 바뀌는 파일이 명세 범위 안인가\n□ 표 구조 변경이 있나 (있으면 천천히)\n□ 조각마다 확인 방법이 있나\n□ 모르는 단어는 물어봤나'],
 w:['계획을 읽지 않고 바로 승인해요.','오타 하나 고치는 일까지 계획 모드로 해서 시간을 써요.','계획과 다르게 진행되는데 끝까지 지켜보기만 해요.']},
'2-2':{s:'좋은 작업 조각은 한 문장으로 설명되고, 끝났는지 확인할 방법이 있어요. 조각 하나가 끝나면 확인하고 커밋해요. 그래야 망가져도 바로 앞 조각으로 돌아가고, 무엇이 문제였는지 찾기 쉬워요.',
 p:['조각 순서는 데이터 → 서버 → 화면이 무난해요.','한 조각에서 두 가지를 바꾸지 않아요. 기능 추가와 정리는 따로 해요.','같은 문제를 두 번 고쳐도 안 되면 /clear 후 더 구체적으로 다시 요청해요.'],
 t:[['작업 단위','unit of work|유닛 오브 워크','한 번에 맡기고 확인하는 일의 크기'],['커밋','commit|커밋','확인된 변경을 저장 지점으로 남기는 일'],['컨텍스트','context|컨텍스트','AI가 지금 대화에서 기억하는 내용 전체']],
 e:['팀 기능 쪼개기','1. teams · members 표 만들기   확인: 표가 보임\n2. RLS 규칙                  확인: 다른 계정으로 시험\n3. 팀 만들기 화면            확인: 눌러서 팀 생성\n4. 팀 메모 목록              확인: 팀원만 보임'],
 w:['"팀 기능 전부"를 한 번에 맡겨요.','여러 조각을 끝낸 뒤 한꺼번에 커밋해요.','틀린 방향을 여러 번 고치며 대화를 계속 길게 끌어요.']},
'2-3':{s:'CLAUDE.md는 AI가 대화를 시작할 때마다 읽는 프로젝트 규칙 파일이에요. /init으로 첫 판을 만들고, AI가 같은 실수를 두 번 하면 규칙을 한 줄 더해요. 짧을수록 잘 지켜요.',
 p:['넣을 것: 실행 명령, 우리만의 규칙, 헷갈리기 쉬운 점.','뺄 것: 코드를 읽으면 알 수 있는 것, "깔끔하게" 같은 막연한 말.','200줄 아래로 유지하고, 꼭 지킬 한 줄에만 IMPORTANT를 붙여요.'],
 t:[['CLAUDE.md','|클로드 엠디','대화마다 읽는 프로젝트 규칙 파일'],['/init','|이닛','프로젝트를 읽고 CLAUDE.md 첫 판을 만드는 명령'],['/context','|컨텍스트','지금 불러온 규칙 파일을 확인하는 명령']],
 e:['규칙 몇 줄','# 명령\n- 테스트: npm test\n# 규칙\n- 표를 바꿀 땐 먼저 계획을 보여줘\n- 비밀 키는 VITE_ 이름에 넣지 않는다'],
 w:['규칙을 더하기만 해서 파일이 계속 길어져요.','"좋은 코드를 써줘"처럼 확인할 수 없는 규칙을 적어요.','팀원과 함께 지킬 규칙을 커밋하지 않아요.']},
'2-4':{s:'diff는 무엇이 바뀌었는지 보여 주는 화면이에요. 모든 줄을 이해하지 못해도 돼요. 바뀐 파일 목록, 지워진 줄, 표와 권한에 닿는 변경을 먼저 봐요. 모르는 부분은 그 자리에서 물어요.',
 p:['파일 목록부터 봐요. 계획에 없던 파일이 바뀌었으면 이유를 물어요.','빨간 줄(지워진 줄)을 특히 봐요. 필요한 코드가 사라지기도 해요.','/code-review는 지금 바뀐 내용을 새 눈으로 검토해 버그를 찾아 줘요.'],
 t:[['diff','|디프','바뀐 내용을 줄 단위로 비교한 것'],['코드 리뷰','code review|코드 리뷰','바뀐 코드를 다른 눈으로 검토하는 일'],['/code-review','|코드 리뷰','바뀐 내용의 버그를 따로 검토하는 기본 스킬']],
 e:['검토할 때 묻는 말','지워진 코드는 원래 무슨 일을 했어?\n계획에 없던 파일은 왜 바뀌었어?\n이 변경으로 다른 팀 데이터가 보일 수 있어?'],
 w:['diff를 보지 않고 승인만 눌러요.','지워진 줄은 그냥 넘겨요.','"문제없지?"라고 물어 "네"를 확인으로 삼아요.']},
'2-5':{s:'매번 붙여 넣는 절차는 스킬로 만들어요. .claude/skills에 SKILL.md를 두면 /이름으로 불러 써요. 여러 파일을 넓게 찾아보는 일은 서브에이전트에게 맡기면 내 대화가 깨끗하게 유지돼요.',
 p:['스킬: "배포 전 점검"처럼 순서가 정해진 일에 써요.','"서브에이전트로 ~를 조사해줘"라고 하면 따로 찾아보고 요약만 가져와요.','예전 커스텀 명령(.claude/commands)도 그대로 동작해요.'],
 t:[['스킬','skill|스킬','자주 쓰는 절차를 묶어 /이름으로 부르는 기능'],['서브에이전트','subagent|서브에이전트','따로 일하고 요약만 돌려주는 보조 AI'],['SKILL.md','|스킬 엠디','스킬의 설명과 절차를 적는 파일']],
 e:['스킬 파일 예시','.claude/skills/predeploy/SKILL.md\n---\ndescription: 배포 전 점검\n---\nnpm test → npm run build → 키 검사']},
'3-1':{s:'TypeScript는 JavaScript에 값의 모양을 적는 문법을 더한 거예요. 메모에 id와 body가 있다고 적어 두면, 없는 칸을 쓸 때 실행 전에 빨간 줄로 알려 줘요.',
 p:['Vite는 변환만 하고 타입 검사는 하지 않아요. 검사는 npx tsc --noEmit으로 따로 돌려요.','빨간 줄을 없애려고 any를 쓰면 검사가 꺼져요.','타입 에러 메시지를 그대로 AI에게 주면 고치기 쉬워요.'],
 t:[['타입','type|타입','값의 모양. 글자, 숫자, 메모처럼'],['타입 검사','type check|타입 체크','타입이 맞는지 실행 전에 확인하는 일'],['any','|애니','어떤 값이든 허용하는 타입. 검사가 꺼져요']],
 e:['타입이 잡아 주는 실수','type Memo = { id: number; body: string }\nmemo.text      // Memo에 text가 없어요\nmemo.id = "1"  // 숫자 자리에 글자'],
 w:['빨간 줄을 없애려고 any나 @ts-ignore를 붙여요.','개발 서버가 돌아가니 타입도 맞다고 생각해요.','타입 에러를 요약해서 전달해요. 전문을 줘요.']},
'3-2':{s:'한 번에 전부 옮기면 빨간 줄이 쏟아져요. 먼저 설정 파일(tsconfig)을 추가하고, 작은 파일부터 하나씩 .jsx를 .tsx로 바꿔요. 파일 하나를 옮길 때마다 타입 검사를 통과시키고 커밋해요.',
 p:['순서는 설정 → 작은 도우미 파일 → 화면 파일이 무난해요.','.js와 .ts가 섞여 있어도 동작해요. 서두르지 않아도 돼요.','옮기는 조각에서는 동작을 바꾸지 않아요.'],
 t:[['tsconfig','|티에스 컨피그','TypeScript 검사 규칙을 담은 설정 파일'],['.tsx','|티에스엑스','화면(JSX)이 들어간 TypeScript 파일'],['마이그레이션','migration|마이그레이션','한 방식에서 다른 방식으로 옮기는 일']],
 e:['조각마다 확인','npx tsc --noEmit   # 타입 검사만\nnpm run build      # 배포용으로 묶기\n둘 다 통과하면 커밋']},
'3-3':{s:'Supabase CLI로 내 표 구조에서 타입 파일을 자동으로 만들 수 있어요. 이 파일을 Supabase 클라이언트에 연결하면 표 이름이나 칸 이름을 틀렸을 때 바로 알려 줘요. 표를 바꾸면 다시 만들어요.',
 p:['원격 프로젝트는 --project-id에 프로젝트 id를 넣어요.','createClient<Database>(…)처럼 타입을 연결해요.','Tables<\'memos\'>로 memos 한 줄의 타입을 꺼내 써요.'],
 t:[['Supabase CLI','|수파베이스 씨엘아이','터미널에서 Supabase를 다루는 도구'],['gen types','generate types|젠 타입스','표 구조로 타입을 만드는 명령'],['Database 타입','|데이터베이스 타입','내 표 전체 구조를 담은 타입']],
 e:['타입 만들기 (공식 문서 기준)','npx supabase login\nnpx supabase gen types typescript \\\n  --project-id "$PROJECT_REF" --schema public \\\n  > src/database.types.ts']},
'3-4':{s:'파일을 종류별로만 모으면 기능 하나를 고칠 때 여러 폴더를 오가요. 기능별(memos, auth, summary)로 모으면 고칠 곳이 한 폴더에 있고, AI에게 범위를 주기도 쉬워요.',
 p:['기능 폴더 안에 화면, 데이터 함수, 타입을 함께 둬요.','여러 기능이 같이 쓰는 것만 shared에 둬요.','정한 구조는 CLAUDE.md에 적어 AI가 지키게 해요.'],
 t:[['폴더 구조','folder structure|폴더 스트럭처','파일을 어떤 기준으로 묶는지 정한 것'],['컴포넌트','component|컴포넌트','화면을 이루는 재사용 조각'],['shared','|셰어드','여러 기능이 함께 쓰는 코드를 두는 곳']],
 e:['기능별 폴더 예시','src/features/memos/  MemoList.tsx  api.ts\nsrc/features/auth/   Login.tsx\nsrc/shared/          supabase.ts'],
 w:['구조 정리와 기능 추가를 한 조각에서 같이 해요.','정리한 뒤 실행해 보지 않고 커밋해요.','AI가 제안할 때마다 구조를 바꿔 규칙이 흔들려요.']},
'4-1':{s:'테스트는 "이렇게 하면 이렇게 돼야 한다"를 코드로 적은 채점표예요. 통과 · 실패로 답하니 AI가 스스로 돌려 보고 고칠 수 있어요. 한번 만들어 두면 나중에 다른 곳을 고쳐도 예전 기능이 깨지지 않았는지 바로 알아요.',
 p:['요청에 "테스트가 통과할 때까지"를 붙이면 AI가 스스로 확인해요.','"통과했어요" 대신 테스트 결과 화면을 보여 달라고 해요.','권한 · 데이터처럼 깨지면 아픈 곳부터 테스트해요.'],
 t:[['테스트','test|테스트','기대한 결과가 나오는지 자동으로 확인하는 코드'],['회귀','regression|리그레션','고친 것 때문에 예전 기능이 다시 깨지는 일'],['통과 · 실패','pass · fail|패스 · 페일','테스트의 결과. 초록과 빨강으로 보여요']],
 e:['테스트를 기준으로 맡기기','메모 글자 수 제한을 1000자로 바꿔줘.\n관련 테스트를 먼저 고치고, npm test가\n모두 통과하면 결과를 보여줘.'],
 w:['AI가 테스트를 바꿔서 통과시켜요. 테스트를 바꿨다면 이유를 물어요.','테스트가 실패하는데 "가끔 그래요" 하고 넘어가요.','화면 하나하나까지 다 테스트하려다 지쳐요.']},
'4-2':{s:'Vitest는 Vite 프로젝트에 잘 맞는 테스트 도구예요. 함수에 값을 넣고 기대한 값이 나오는지 확인해요. 이름에 .test.가 들어간 파일을 테스트로 알아봐요.',
 p:['설치는 npm install -D vitest, 실행은 npm test예요.','Node.js 22.12 이상이 필요해요. 오래된 버전이면 먼저 올려요.','화면보다 계산 · 검사 함수(글자 수, 날짜, 권한)부터 테스트해요.'],
 t:[['Vitest','|비테스트','Vite와 함께 쓰는 테스트 도구'],['단위 테스트','unit test|유닛 테스트','함수 하나처럼 작은 단위를 확인하는 테스트'],['expect','|익스펙트','"이 값이 이래야 해"를 적는 함수']],
 e:['테스트 한 개','import { expect, test } from \'vitest\'\nimport { isTooLong } from \'./limit\'\ntest(\'1000자를 넘으면 막아요\', () => {\n  expect(isTooLong(\'가\'.repeat(1001))).toBe(true)\n})']},
'4-3':{s:'Playwright는 진짜 브라우저를 자동으로 움직여 사용자처럼 눌러 보는 도구예요. "메모 쓰기 → 목록에 보임" 같은 흐름 전체를 확인해요. 느린 대신 실제와 가장 가까워요.',
 p:['npm init playwright@latest로 시작하면 설정과 예시 테스트가 생겨요.','npx playwright test --ui로 움직이는 모습을 보며 고쳐요.','핵심 흐름 두세 개만 만들어요. 많으면 느리고 자주 깨져요.'],
 t:[['Playwright','|플레이라이트','브라우저를 자동으로 조작하는 테스트 도구'],['E2E 테스트','end-to-end test|엔드 투 엔드 테스트','처음부터 끝까지 사용자 흐름을 확인하는 테스트'],['getByRole','|겟 바이 롤','버튼, 입력칸처럼 역할로 화면 요소를 찾는 방법']],
 e:['자주 쓰는 명령','npm init playwright@latest   # 처음 설정\nnpx playwright test          # 전체 실행\nnpx playwright test --ui     # 보면서 실행\nnpx playwright show-report   # 결과 보기']},
'4-4':{s:'버그를 고칠 때는 먼저 그 버그를 재현하는 테스트를 만들어 실패하는 걸 확인해요. 그다음 통과하도록 고쳐요. 진짜 고쳐졌다는 증거가 남고, 같은 버그가 다시 나오면 테스트가 잡아요.',
 p:['순서: 실패하는 테스트 → 실패 확인 → 고치기 → 통과 확인.','"테스트는 그대로 두고 코드만 고쳐"라고 선을 그어요.','새 기능도 완료 조건을 테스트로 먼저 적으면 AI가 목표를 정확히 알아요.'],
 t:[['재현','reproduce|리프로듀스','문제를 다시 일으켜 보는 것'],['실패하는 테스트','failing test|페일링 테스트','버그를 드러내는, 아직 통과하지 못하는 테스트'],['TDD','Test-Driven Development|티디디','테스트를 먼저 쓰고 코드를 맞추는 방식']],
 e:['버그를 맡기는 순서','빈 메모도 저장되는 버그가 있어.\n1. 이 버그를 재현하는 테스트를 먼저 만들고\n   실패하는 걸 보여줘\n2. 테스트는 그대로 두고 코드만 고쳐서 통과시켜줘'],
 w:['고치기부터 하고 테스트는 나중에 붙여요.','실패를 확인하지 않아서 처음부터 통과하는 엉터리 테스트가 생겨요.','AI가 테스트의 기대값을 바꿔서 통과시켜요.']},
'4-5':{s:'main은 배포되는 코드예요. 그래서 main에 바로 올리지 않고, 브랜치에서 작업한 뒤 PR(풀 리퀘스트)을 열어요. 바뀐 내용과 검사 결과를 확인하고, 괜찮을 때 합쳐요. 혼자 일해도 이 습관이 안전망이 돼요.',
 p:['조각 하나 = 브랜치 하나 = PR 하나가 다루기 쉬워요.','PR 설명에 무엇을, 왜, 어떻게 확인했는지 적어요.','Rulesets로 PR 필수 · 검사 통과 필수를 켜면 실수로 main에 못 올려요.'],
 t:[['풀 리퀘스트','pull request|풀 리퀘스트','내 브랜치를 합쳐 달라는 요청. 줄여서 PR'],['머지','merge|머지','브랜치의 변경을 다른 브랜치에 합치는 일'],['룰셋','ruleset|룰셋','브랜치에 걸어 두는 GitHub 규칙 모음']],
 e:['PR 설명 틀','무엇을: 팀 메모 목록 화면\n왜: v5 완료 조건 2번\n확인: npm test 통과, 미리보기에서\n      다른 계정으로 안 보임 확인'],
 w:['큰 변경을 PR 하나에 몰아 넣어 검토할 수 없어요.','검사가 빨간데 "일단 합치고 고치자"고 해요.','PR 설명 없이 제목만 남겨요.']},
'4-6':{s:'GitHub Actions는 PR마다 정해 둔 검사를 자동으로 돌려요. Vercel은 PR마다 미리보기 배포를 만들고 주소를 댓글로 남겨 줘요.',
 p:['검사 설정은 .github/workflows 폴더의 파일에 적어요. 작성은 AI에게 맡겨요.','미리보기는 Preview 환경 변수를 써요. Supabase 값도 Preview에 넣어요.','미리보기에서 로그인하려면 Supabase Redirect URLs에 미리보기 주소 패턴을 더해요.'],
 t:[['GitHub Actions','|깃허브 액션스','GitHub에서 검사와 작업을 자동으로 돌리는 기능'],['CI','Continuous Integration|씨아이','변경마다 자동으로 검사하는 흐름'],['미리보기 배포','preview deployment|프리뷰 디플로이먼트','합치기 전 변경을 따로 올려 보는 배포']],
 e:['PR마다 도는 검사','npm ci → npx tsc --noEmit\n→ npx vitest run → npm run build']},
'5-1':{s:'대시보드에서 표를 손으로 바꾸면 무엇을 언제 바꿨는지 남지 않아요. 마이그레이션은 표 변경을 SQL 파일로 남기는 방법이에요. 파일이 Git에 쌓이니 되돌아볼 수 있고, 다른 환경에도 같은 순서로 적용해요.',
 p:['migration new로 파일을 만들고, db push로 원격에 적용해요.','이미 대시보드에서 바꿨다면 db pull로 지금 상태를 파일로 가져와요.','적용 전에 SQL을 꼭 읽어요. 칸을 지우는 drop은 데이터도 지워요.'],
 t:[['마이그레이션','migration|마이그레이션','DB 구조 변경을 파일로 남긴 것'],['db push','|디비 푸시','쌓인 변경 파일을 원격 DB에 적용하는 명령'],['drop','|드롭','표나 칸을 지우는 SQL. 데이터도 함께 사라져요']],
 e:['변경 흐름 (공식 문서 기준)','npx supabase migration new add_teams\n# supabase/migrations/…_add_teams.sql 작성\nnpx supabase db push\n# 그다음 gen types로 타입 다시 만들기'],
 w:['대시보드에서 바꾸고 파일로 남기지 않아요.','이미 적용한 마이그레이션 파일을 고쳐요. 고칠 땐 새 파일로 해요.','drop이 든 SQL을 읽지 않고 승인해요.']},
'5-2':{s:'팀(teams)과 팀원(members) 표를 만들어요. members에는 팀 id, 사람 id, 역할을 둬요. 역할은 관리자(admin)와 멤버(member) 두 개로 시작해요. 팀을 만든 사람은 자동으로 관리자가 되게 해요.',
 p:['메모에는 team_id를 더해 어느 팀 메모인지 적어요.','역할은 꼭 필요한 만큼만. 처음엔 두 개면 충분해요.','마지막 관리자는 팀을 나가지 못하게 해요.'],
 t:[['역할','role|롤','팀 안에서 할 수 있는 일의 범위'],['관리자','admin|어드민','팀원 초대와 삭제까지 할 수 있는 역할'],['기본 키','primary key|프라이머리 키','한 줄을 하나로 정하는 칸. members는 팀 id + 사람 id']],
 e:['역할마다 할 수 있는 일','         보기  쓰기  지우기   초대\nadmin     O     O     O       O\nmember    O     O     내 것만  X'],
 w:['역할을 처음부터 다섯 개씩 만들어요.','역할을 화면에서만 확인해요. 규칙은 DB에서 막아야 해요.','팀을 만든 사람을 members에 넣지 않아 자기 팀도 못 봐요.']},
'5-3':{s:'v3에서는 "내 메모만"이었다면, 이제는 "내가 팀원인 팀의 메모만"이에요. 팀원 확인을 security definer 함수로 만들어 규칙에서 불러요. 규칙이 쓰는 칸에는 인덱스를 둬야 메모가 많아도 빨라요.',
 p:['규칙 안에서 members를 바로 읽으면 무한 반복 에러가 나기 쉬워요.','security definer 함수에는 search_path = \'\'를 꼭 넣어요.','읽기 · 쓰기 · 수정 · 삭제 규칙을 따로 만들어요.'],
 t:[['security definer','|시큐리티 데피너','만든 사람 권한으로 도는 함수. RLS를 건너뛰어요'],['인덱스','index|인덱스','칸을 빨리 찾게 해 주는 색인'],['정책','policy|폴리시','RLS에서 허락 조건을 적은 규칙 하나']],

 w:['"일단 다 열어 두고 나중에 막자"고 해요.','읽기 규칙만 만들고 쓰기 · 삭제 규칙을 빠뜨려요.','확인 함수를 아무나 부를 수 있는 곳에 둬요.']},
'5-4':{s:'관리자가 이메일을 입력하면 초대 기록을 남기고 로그인 링크 메일을 보내요. 그 이메일로 로그인하면 초대를 확인해 팀원으로 넣어요. 초대에는 만료 시간을 둬요.',
 p:['초대 기록(invites)에는 팀, 이메일, 역할, 만료 시각을 적어요.','초대 수락은 로그인한 사람의 이메일과 같을 때만 허락해요.','Supabase 기본 메일은 조직 팀원 주소로만 가요. 실제 사용자에겐 SMTP를 연결해요.'],
 t:[['초대','invite|인바이트','팀에 들어오라는 요청'],['SMTP','Simple Mail Transfer Protocol|에스엠티피','메일을 보내는 표준 방식. 메일 서버를 뜻하기도 해요'],['만료','expiry|익스파이어리','정해진 시간이 지나면 못 쓰게 되는 것']],
 e:['초대 흐름','관리자: 이메일 입력 → invites에 저장 → 메일\n받은 사람: 링크로 로그인\n앱: 초대 확인 → members에 추가 → 초대 지우기']},
'5-5':{s:'RLS는 직접 확인하기 전까지 믿지 않아요. 관리자, 멤버, 다른 팀 사람 세 계정으로 보기 · 쓰기 · 지우기 · 초대를 하나씩 해 보고 표에 적어요. 이 표를 테스트로 옮겨 두면 규칙을 바꿀 때마다 확인돼요.',
 p:['기대와 다르게 나온 칸이 바로 고칠 곳이에요.','버튼을 숨기는 것으론 부족해요. 직접 요청해도 막혀야 해요.','Supabase는 supabase/tests 폴더에 정책 테스트를 두는 방법을 안내해요.'],
 t:[['권한 표','permission matrix|퍼미션 매트릭스','누가 무엇을 할 수 있는지 칸으로 정리한 표'],['정책 테스트','policy test|폴리시 테스트','RLS가 허락 · 거부를 맞게 하는지 확인하는 테스트'],['우회','bypass|바이패스','정상 경로를 피해 직접 요청하는 것']],
 e:['권한 표 예시','              관리자  멤버  다른 팀\n팀 메모 보기     O      O      X\n남의 메모 삭제   O      X      X\n팀원 초대        O      X      X'],
 w:['내 계정 하나로만 확인해요.','화면에 버튼이 없으니 안전하다고 생각해요.','규칙을 고친 뒤 다시 확인하지 않아요.']},
'6-1':{s:'Supabase Storage는 파일을 버킷에 담아요. 공개 버킷은 주소만 알면 누구나 열어요. 팀 파일은 비공개 버킷에 두고, 경로를 "팀id/파일이름"으로 정해 규칙으로 팀원만 읽고 쓰게 해요.',
 p:['Storage 권한도 RLS예요. storage.objects 표에 규칙을 걸어요.','경로 첫 폴더는 storage.foldername(name)으로 꺼내 팀 id와 비교해요.','파일을 보여 줄 때는 짧게 유효한 서명된 주소를 만들어요.'],
 t:[['버킷','bucket|버킷','파일을 담는 큰 상자. 공개 · 비공개를 정해요'],['서명된 주소','signed URL|사인드 유알엘','정해진 시간 동안만 열리는 파일 주소'],['storage.objects','|스토리지 오브젝츠','올린 파일 정보가 담기는 표. 여기에 규칙을 걸어요']],
 e:['경로로 팀을 나눠요','memo-files/        비공개 버킷\n  팀A-id/회의록.pdf\n  팀B-id/시안.png\n규칙: 첫 폴더가 내가 속한 팀일 때만'],
 w:['편해서 공개 버킷에 팀 파일을 올려요.','파일 이름만으로 경로를 만들어 팀끼리 섞여요.','올리기 규칙만 만들고 읽기 규칙을 빠뜨려요.']},
'6-2':{s:'Supabase Realtime으로 표의 변화를 구독하면, 다른 팀원이 쓴 메모가 새로고침 없이 바로 보여요. 표를 supabase_realtime 목록에 추가하고, 화면에서 구독해요. RLS도 그대로 적용돼요.',
 p:['지금 보는 팀의 메모만 받도록 filter를 걸어요.','화면을 떠나면 구독을 꼭 해제해요. 안 그러면 연결이 쌓여요.','사용자가 아주 많아지면 Broadcast 방식이 더 잘 버텨요.'],
 t:[['Realtime','|리얼타임','DB 변화를 화면에 바로 알려 주는 Supabase 기능'],['구독','subscribe|서브스크라이브','변화가 생기면 알려 달라고 등록하는 것'],['발행','publication|퍼블리케이션','변화를 내보낼 표 목록']],

'6-3':{s:'알림 메일은 Supabase 로그인 메일과 따로 보내요. 메일 발송 서비스에 가입하고, 서버 함수에서 그 서비스의 API를 불러요. 키는 서버 환경 변수에만 두고, 꼭 필요한 순간에만 보내요.',
 p:['로그인 메일과 알림 메일을 섞지 않아요. Supabase 문서도 따로 쓰라고 해요.','알림 끄기를 처음부터 넣어요.','같은 알림이 여러 번 가지 않게 보낸 기록을 남겨요.'],
 t:[['메일 발송 서비스','email API|이메일 에이피아이','앱 대신 메일을 보내 주는 서비스'],['도메인 인증','domain verification|도메인 베리피케이션','내 도메인에서 보낸 메일임을 증명하는 설정'],['수신 거부','unsubscribe|언서브스크라이브','알림을 그만 받겠다는 선택']],

'6-4':{s:'메모가 수천 개가 되면 한 번에 다 불러오기 느려요. 목록은 20개씩 나눠 불러오고, 더 보기를 누르면 다음 20개를 가져와요. 자주 거르고 정렬하는 칸에 인덱스를 두면 DB가 빨리 찾아요.',
 p:['.range(0, 19)처럼 범위를 정해 불러와요.','목록에 필요한 칸만 select해요.','느린 곳은 추측하지 말고 먼저 재요.'],
 t:[['페이지 나누기','pagination|페이지네이션','목록을 조각내어 불러오는 방법'],['인덱스','index|인덱스','칸을 빨리 찾게 해 주는 색인'],['쿼리','query|쿼리','DB에 보내는 요청']],
 e:['20개씩 불러오기','supabase.from(\'memos\')\n  .select(\'id, body, created_at\')\n  .eq(\'team_id\', teamId)\n  .order(\'created_at\', { ascending: false })\n  .range(0, 19)']},
'7-1':{s:'긴 요약은 다 만들어질 때까지 몇 초가 걸려요. 스트리밍을 쓰면 글자가 만들어지는 대로 받아서 바로 보여 줄 수 있어요. 전체 시간은 같아도 기다리는 느낌이 훨씬 줄어요.',
 p:['공식 SDK의 messages.stream으로 받아요.','서버 함수는 받은 조각을 모으지 말고 바로 화면으로 보내요.','중간에 끊겨도 받은 만큼은 보여 주고, 다시 시도 버튼을 둬요.'],
 t:[['스트리밍','streaming|스트리밍','결과를 나오는 대로 조금씩 보내는 방식'],['체감 속도','perceived speed|퍼시브드 스피드','사용자가 느끼는 빠르기'],['청크','chunk|청크','한 번에 오는 결과 조각']],

'7-2':{s:'"JSON으로 줘"라고 글로만 부탁하면 가끔 모양이 깨져요. 구조화된 출력을 쓰면 내가 정한 스키마(칸 이름과 종류)대로 답이 와요. 화면은 그 칸을 그대로 쓰면 돼요.',
 p:['요청에 output_config.format으로 스키마를 넣어요. 예전 output_format은 쓰지 않아요.','SDK의 messages.parse()를 쓰면 스키마 검사까지 해 줘요.','칸 이름은 API 약속처럼 미리 정하고 자주 바꾸지 않아요.'],
 t:[['구조화된 출력','structured outputs|스트럭처드 아웃풋','정한 모양(스키마)대로 답을 받는 기능'],['스키마','schema|스키마','데이터의 칸 이름과 종류를 정한 설계'],['파싱','parsing|파싱','받은 글을 프로그램이 쓰는 값으로 바꾸는 일']],
 e:['받고 싶은 모양','{\n  "decisions": ["금요일 출시"],\n  "todos": [{ "who": "민지", "what": "시안 정리" }]\n}'],

'7-3':{s:'프롬프트를 고치면 어떤 메모에선 좋아지고 어떤 메모에선 나빠져요. 그래서 진짜 메모 10~20개와 기대하는 결과를 모아 예시 모음을 만들어요. 고칠 때마다 전체를 돌려 점수가 올랐는지 확인해요.',
 p:['쉬운 예, 헷갈리는 예, 빈 메모처럼 다양하게 모아요.','채점 기준을 먼저 정해요. 예: 할 일을 빠짐없이 뽑았나.','점수와 함께 틀린 예를 직접 읽어요.'],

'7-4':{s:'응답마다 usage에 입력 · 출력 토큰 수가 와요. 기능별로 기록하면 어디서 돈이 나가는지 보여요. 매번 똑같이 보내는 긴 앞부분은 프롬프트 캐싱으로 더 싸게 처리할 수 있어요. 너무 짧은 앞부분은 캐시되지 않아요.',
 p:['usage.input_tokens · output_tokens를 요청마다 남겨요.','캐싱은 앞부분이 똑같아야 맞아요. 시각처럼 바뀌는 값은 뒤에 둬요.','캐시가 되는지는 usage.cache_read_input_tokens로 확인해요.'],

'8-1':{s:'배포한 사이트에서 난 에러는 내 화면에 안 보여요. 에러 모니터링 서비스를 붙이면 사용자 화면에서 난 에러를 모아 알려 줘요. 어느 브라우저에서, 어느 줄에서, 몇 명이 겪었는지 보여요.',
 p:['React는 @sentry/react를 설치하고 한 번 초기화하면 돼요.','소스맵을 올려야 압축된 코드 대신 원래 코드 줄이 보여요.','새로 생긴 에러만 알림이 오게 해서 알림 피로를 줄여요.'],

  <div class="ovg">${STAGES.map(st=>`<div class="ovc"><span class="k">STAGE ${st.k}</span><h3>${st.name}</h3><p>${st.desc}</p><ol>${st.parts.map(i=>ready(PARTS[i])
    ? `<li><button type="button" data-go="p${i}"><span class="n">${pad(i)}</span><span>${PARTS[i].short}</span></button></li>`
    : `<li><span class="todo"><span class="n">${pad(i)}</span><span>${PARTS[i].short}</span><em>준비 중</em></span></li>`).join('')}</ol><span class="h">${st.hours}</span></div>`).join('')}</div>
  <div class="how">${B.how.map(([ic,t,d])=>`<div><div class="t">${IC[ic]}${t}</div><p>${d}</p></div>`).join('')}</div></div>`;
}
function stageSlide(st){
  return `<div class="sg"><div><p class="eb"><em>STAGE ${st.k}</em> · ${range(st)}</p><h2 class="big">${st.name}</h2><p class="ld">${st.desc}.</p><p class="hrs">${IC.clock}${st.hours}</p></div>
    <ol class="sgl">${st.parts.map(i=>{ const p=PARTS[i]; return ready(p)
      ? `<li><button type="button" data-go="p${i}"><span class="n">${pad(i)}</span><span class="t">${p.title}<span class="d">${p.short} · 챕터 ${p.lessons.length}개</span></span><span class="h">${p.time}</span></button></li>`
      : `<li><span class="sgx"><span class="n">${pad(i)}</span><span class="t">${p.title}<span class="d">준비 중이에요</span></span><span class="h"></span></span></li>`; }).join('')}</ol></div>`;
}
function partSlides(st,i){
  const p=PARTS[i];
  add('p'+i, `<div class="pa"><div>
      <p class="eb"><em>PART ${pad(i)}</em> · ${st.k}단계 ${st.name}</p>
      <h2 class="st">${p.title}</h2>
      <p class="ld">${p.lede}</p>
      <div class="blk"><p class="lbl">학습 목표</p><ul class="goals">${p.goals.map(g=>`<li>${IC.goal}<span>${g}</span></li>`).join('')}</ul></div>
      <div class="facts"><div>${IC.clock}<span>예상 <b>${p.time}</b></span></div><div>${IC.list}<span>챕터 <b>${p.lessons.length}개</b></span></div></div>
     </div><figure class="fx"><div class="frame">${B.fig(i)}</div><figcaption><b>그림 ${i}</b>${p.cap}</figcaption></figure></div>`);
  add('p'+i, `<div class="pb">
      <p class="eb"><em>PART ${pad(i)}</em> · 챕터</p>
      <h2 class="st">${p.title}</h2>
      <div class="cg ${p.lessons.length===4?'c2':'c3'}">${p.lessons.map((l,j)=>{const id=`l-${i}-${j+1}`;return `<div class="ch" data-id="${id}"><div class="hd"><label class="chk"><input type="checkbox" id="${id}" aria-label="${i}-${j+1} ${l[0]} 완료"><span class="box">${IC.check}</span></label><span class="num">${i}-${j+1}</span>${depthTag(l[3])}<button class="more" type="button" data-detail="${i}-${j+1}"><span>자세히</span>${IC.arrow}</button></div><div class="tt">${l[0]}</div><p class="ds">${l[1]}</p><div class="terms">${l[2].map(t=>`<code>${esc(t)}</code>`).join('')}</div></div>`}).join('')}</div>
      <div class="pr"><div class="top"><p class="lbl">${IC.chat}AI에게 이렇게 말해 보세요</p><button class="copy" type="button" data-copy="pt${i}">${IC.copy}<span>복사</span></button></div><p class="tx" id="pt${i}">${esc(p.prompt)}</p></div>
     </div>`);
  if(p.steps) add('p'+i, `<div class="px"><div>
      <p class="eb"><em>PART ${pad(i)}</em> · 실습</p>
      <h2 class="st">${p.title}</h2>
      <div class="rs"><p class="lbl">${IC.target}이 Part를 마치면</p><ul>${p.result.map(r=>`<li>${IC.goal}<span>${r}</span></li>`).join('')}</ul></div>
      <div class="stk"><p class="lbl">${IC.alert}막혔을 때</p><dl>${p.stuck.map(([q,a])=>`<div><dt>${q}</dt><dd>${a}</dd></div>`).join('')}</dl></div>
     </div><div><p class="lbl">${IC.list}따라 하기</p><ol class="steps">${p.steps.map(([t,c],k)=>`<li><span class="n">${k+1}</span><div><p class="t">${t}</p>${c?`<div class="sp"><code id="sp${i}-${k}">${esc(c)}</code><button class="copy" type="button" data-copy="sp${i}-${k}">${IC.copy}<span>복사</span></button></div>`:''}</div></li>`).join('')}</ol></div></div>`);
}
function buildSlides(){
  slides=[]; firstOf={};
  add('cover', B.cover());
  add('ov', ovSlide());
  STAGES.forEach(st=>{
    const live=st.parts.filter(i=>ready(PARTS[i]));
    if(!live.length) return;
    add('s'+st.k, stageSlide(st));
    live.forEach(i=>partSlides(st,i));
  });
  add('end', B.end());
}
function renderDeck(){
  deck.innerHTML = slides.map((s,i)=>`<section class="slide" data-i="${i}" aria-roledescription="slide" aria-label="${i+1} / ${N}">${s.html}<div class="foot"><span>${B.name}</span><span>${pad(i+1)} / ${pad(N)}</span></div></section>`).join('')
  + `<div class="dlg" id="dlg" hidden><div class="dlg-p" role="dialog" aria-modal="true" aria-labelledby="dlgT">
  <div class="dh"><div><p class="eb" id="dlgE"></p><h3 id="dlgT"></h3><p class="one" id="dlgO"></p></div><button class="xbtn" id="dlgX" type="button" aria-label="닫기">${IC.x}</button></div>
  <div class="db" id="dlgB"></div>
  <div class="df"><label class="dchk"><span class="chk"><input type="checkbox" id="dlgChk"><span class="box">${IC.check}</span></span>이 챕터를 다 읽었어요</label>
  <div class="dnav"><button type="button" id="dlgPrev">${IC.left}이전 챕터</button><button type="button" id="dlgNext">다음 챕터${IC.right}</button></div></div>
</div></div>`;
  els=[...deck.querySelectorAll('.slide')];
  svgs=[...deck.querySelectorAll('svg.fg')];
  dlg=document.getElementById('dlg'); dlgB=document.getElementById('dlgB'); dlgChk=document.getElementById('dlgChk'); dk=null;
  document.getElementById('dlgX').addEventListener('click',()=>closeD());
  document.getElementById('dlgPrev').addEventListener('click',()=>stepD(-1));
  document.getElementById('dlgNext').addEventListener('click',()=>stepD(1));
}

/* ---------- 목차 ---------- */
function renderNav(){
  let nav=`<button class="item" type="button" data-go="cover" data-key="cover"><span class="n">··</span><span>표지</span><span></span></button><button class="item" type="button" data-go="ov" data-key="ov"><span class="n">··</span><span>구성</span><span></span></button>`;
  STAGES.forEach(st=>{
    const live=st.parts.some(i=>ready(PARTS[i]));
    nav+= live ? `<button class="grp" type="button" data-go="s${st.k}" data-key="s${st.k}">${st.k}단계 · ${st.name}</button>` : `<div class="grp off">${st.k}단계 · ${st.name}</div>`;
    st.parts.forEach(i=> nav+= ready(PARTS[i])
      ? `<button class="item" type="button" data-go="p${i}" data-key="p${i}"><span class="n">${pad(i)}</span><span>${PARTS[i].short}</span><span class="c" id="tc${i}">0/${PARTS[i].lessons.length}</span></button>`
      : `<div class="item off"><span class="n">${pad(i)}</span><span>${PARTS[i].short}</span><span class="c">준비 중</span></div>`);
  });
  nav+=`<button class="item" type="button" data-go="end" data-key="end" style="margin-top:12px"><span class="n">··</span><span>마치며</span><span></span></button>`;
  document.getElementById('nav').innerHTML=nav;
  document.getElementById('brandK').textContent=B.kicker;
  document.getElementById('brandN').textContent=B.name;
}

/* ---------- 화면 맞춤 ---------- */
const stage=document.getElementById('stage');
// 슬라이드는 16:9를 지키고, 네 방향 모두 최소 여백(M)을 둬요. 남는 공간은 가운데 정렬로 나눠요
function fit(){
  const r=stage.getBoundingClientRect(); if(!r.width||!r.height) return;
  const M=innerWidth<=860?16:28;
  const s=Math.max(.05,Math.min((r.width-2*M)/1920, (r.height-2*M)/1080));
  deck.style.transform=`scale(${s})`;
  deck.style.left=((r.width-1920*s)/2)+'px';
  deck.style.top=((r.height-1080*s)/2)+'px';
}
if('ResizeObserver' in window) new ResizeObserver(fit).observe(stage); else addEventListener('resize',fit);

/* ---------- 애니메이션 ---------- */
var view='';
// 움직임 줄이기 설정을 켠 사용자에게만 그림을 멈춰 보여줘요
let paused=false;
try{ paused=matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
function applyMotion(){
  svgs.forEach(s=>{ try{ (paused || view!=='book' || !s.closest('.slide.on')) ? s.pauseAnimations() : s.unpauseAnimations(); }catch(e){} });
}

/* ---------- 라이트/다크 ---------- */
const MODE='vc-textbook-mode';
function setMode(m, keep){
  document.documentElement.setAttribute('data-mode', m);
  ['modeBtn','hModeBtn'].forEach(id=>{ const b=document.getElementById(id);
    b.innerHTML = m==='light' ? `${IC.moon}<span>다크 모드</span>` : `${IC.sun}<span>라이트 모드</span>`;
    b.setAttribute('aria-label', m==='light' ? '다크 모드로 바꾸기' : '라이트 모드로 바꾸기'); });
  document.dispatchEvent(new Event('vc-mode'));
  if(keep){ try{ localStorage.setItem(MODE,m); }catch(e){} }
}
let mode='dark'; try{ mode=localStorage.getItem(MODE)||'dark'; }catch(e){}
setMode(mode);
document.getElementById('modeBtn').addEventListener('click',()=> setMode(document.documentElement.getAttribute('data-mode')==='light'?'dark':'light', true));

/* ---------- 넘기기 ---------- */
function go(i){
  if(dlg && !dlg.hidden) closeD(true);
  i=Math.max(0,Math.min(N-1,i)); cur=i;
  els.forEach((el,k)=>el.classList.toggle('on',k===i));
  els[i].querySelectorAll('svg.fg').forEach(s=>{ try{ s.setCurrentTime(parseFloat(s.dataset.rest)||0); }catch(e){} });
  applyMotion();
  document.getElementById('pgTxt').innerHTML=`<b>${pad(i+1)}</b> / ${pad(N)}`;
  document.getElementById('pgBar').style.width=((i+1)/N*100)+'%';
  document.getElementById('prev').disabled = i===0;
  document.getElementById('next').disabled = i===N-1;
  const key=slides[i].key;
  document.querySelectorAll('#nav [data-key]').forEach(b=>b.classList.toggle('on', b.dataset.key===key));
  const on=document.querySelector('#nav .on'); if(on && on.scrollIntoView) on.scrollIntoView({block:'nearest'});
  try{ localStorage.setItem(B.keySlide,String(i)); }catch(e){}
}
document.getElementById('prev').addEventListener('click',()=>go(cur-1));
document.getElementById('next').addEventListener('click',()=>go(cur+1));
document.addEventListener('keydown',e=>{
  if(view!=='book') return;
  if(dlg && !dlg.hidden){ dlgKey(e); return; }
  if(e.altKey||e.ctrlKey||e.metaKey) return;
  const tag=(e.target.tagName||'').toLowerCase();
  if(['ArrowRight','PageDown'].includes(e.key) || (e.key===' ' && !['input','button'].includes(tag))){ e.preventDefault(); go(cur+1); }
  else if(['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); go(cur-1); }
  else if(e.key==='Home'){ go(0); } else if(e.key==='End'){ go(N-1); }
});
const side=document.getElementById('side'), scrim=document.getElementById('scrim');
function drawer(open){ side.classList.toggle('open',open); scrim.classList.toggle('open',open); }
document.getElementById('tocBtn').addEventListener('click',()=>drawer(!side.classList.contains('open')));
scrim.addEventListener('click',()=>drawer(false));
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-go]'); if(!b) return;
  go(firstOf[b.dataset.go]); drawer(false);
});

/* ---------- 진도 ---------- */
function save(){ try{ localStorage.setItem(B.keyProg, JSON.stringify([...done])); }catch(e){} }
function refresh(){
  deck.querySelectorAll('.ch input').forEach(inp=>{ inp.checked=done.has(inp.id); inp.closest('.ch').classList.toggle('done',inp.checked); });
  PARTS.forEach((p,i)=>{ const el=document.getElementById('tc'+i); if(!el) return; const n=p.lessons.filter((_,j)=>done.has(`l-${i}-${j+1}`)).length; el.textContent=`${n}/${p.lessons.length}`; el.classList.toggle('done',n===p.lessons.length); });
  const n=[...done].filter(id=>{ const [,i,j]=id.split('-').map(Number); return PARTS[i] && ready(PARTS[i]) && j<=PARTS[i].lessons.length; }).length;
  document.getElementById('progTxt').textContent=`${n} / ${TOTAL}`;
  document.getElementById('progBar').style.width=(TOTAL?n/TOTAL*100:0)+'%';
  if(dk) dlgChk.checked=done.has('l-'+dk);
}
deck.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='dlgChk'){ const id='l-'+dk; t.checked?done.add(id):done.delete(id); save(); refresh(); return; }
  if(!t.matches('.ch input')) return;
  t.checked?done.add(t.id):done.delete(t.id); save(); refresh();
});

/* ---------- 복사: data-copy가 가리키는 요소의 글자를 복사해요 ---------- */
deck.addEventListener('click',e=>{
  const b=e.target.closest('.copy'); if(!b) return;
  const src=document.getElementById(b.dataset.copy), lbl=b.querySelector('span'); if(!src) return;
  const reset=t=>{ lbl.textContent=t; setTimeout(()=>lbl.textContent='복사',1600); };
  const fallback=()=>{ const r=document.createRange(); r.selectNodeContents(src); const s=getSelection(); s.removeAllRanges(); s.addRange(r); reset('선택됨'); };
  try{ navigator.clipboard.writeText(src.textContent).then(()=>reset('복사됨'),fallback); }catch(err){ fallback(); }
});

/* ---------- 챕터 상세 팝업 ---------- */
function openD(key){
  const d=DETAIL[key]; if(!d) return;
  const [i,j]=key.split('-').map(Number), p=PARTS[i], l=p.lessons[j-1];
  dk=key;
  document.getElementById('dlgE').innerHTML=`<em>PART ${pad(i)}</em> · ${key} · ${p.title}${l[3]?' '+depthTag(l[3]):''}`;
  document.getElementById('dlgT').textContent=l[0];
  document.getElementById('dlgO').textContent=l[1];
  const gl=d.t.map(([term,r,m])=>{ const [og,rd]=r.includes('|')?r.split('|'):['',r]; return `<li><div class="r1"><code>${esc(term)}</code><span class="rd">[${esc(rd)}]</span>${og?`<span class="og">${esc(og)}</span>`:''}</div><span class="mn">${esc(m)}</span></li>`; }).join('');
  dlgB.innerHTML=`<div><div class="sec"><p class="lbl">개념</p><p class="dsum">${esc(d.s)}</p></div><div class="sec"><p class="lbl">핵심 포인트</p><ul class="dpts">${d.p.map(x=>`<li><span>${esc(x)}</span></li>`).join('')}</ul></div>${d.e?`<div class="sec"><p class="lbl">${esc(d.e[0])}</p><pre class="dex">${esc(d.e[1])}</pre></div>`:''}</div><div><div class="sec"><p class="lbl">용어 읽는 법</p><ul class="gl">${gl}</ul></div>${d.w?`<div class="sec"><p class="lbl">흔한 실수</p><ul class="dw">${d.w.map(x=>`<li><span>${esc(x)}</span></li>`).join('')}</ul></div>`:''}</div>`;
  dlgB.scrollTop=0;
  dlgChk.checked=done.has('l-'+key);
  document.getElementById('dlgPrev').disabled = j===1;
  document.getElementById('dlgNext').disabled = j===p.lessons.length;
  if(dlg.hidden){ lastFocus=document.activeElement; dlg.hidden=false; }
  document.getElementById('dlgX').focus();
}
function closeD(silent){ dlg.hidden=true; dk=null; if(!silent && lastFocus && lastFocus.focus) lastFocus.focus(); }
function stepD(n){ if(!dk) return; const [i,j]=dk.split('-').map(Number); const k=j+n; if(k>=1 && k<=PARTS[i].lessons.length) openD(`${i}-${k}`); }
function dlgKey(e){
  if(e.key==='Escape'){ e.preventDefault(); closeD(); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); stepD(1); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); stepD(-1); }
  else if(e.key==='Tab'){
    const f=[...dlg.querySelectorAll('button:not(:disabled),input')]; if(!f.length) return;
    const a=f[0], z=f[f.length-1];
    if(e.shiftKey && document.activeElement===a){ e.preventDefault(); z.focus(); }
    else if(!e.shiftKey && document.activeElement===z){ e.preventDefault(); a.focus(); }
  }
}
deck.addEventListener('click',e=>{
  if(e.target.closest('.dlg')){ if(e.target===dlg) closeD(); return; }
  if(e.target.closest('.chk') || e.target.closest('.copy')) return;
  const m=e.target.closest('[data-detail]'); if(m){ openD(m.dataset.detail); return; }
  const c=e.target.closest('.ch'); if(c) openD(c.dataset.id.slice(2));
});

/* ---------- 교과서 펼치기 ---------- */
function loadBook(id){
  if(B && B.id===id) return;
  if(dlg && !dlg.hidden) closeD(true);
  B=BOOKDATA[id]; STAGES=B.stages; PARTS=B.parts; DETAIL=B.detail;
  TOTAL=PARTS.reduce((a,p)=>a+(ready(p)?p.lessons.length:0),0);
  buildSlides(); N=slides.length;
  renderDeck(); renderNav();
  done=new Set(); try{ done=new Set(JSON.parse(localStorage.getItem(B.keyProg)||'[]')); }catch(e){}
  cur=0; try{ const v=parseInt(localStorage.getItem(B.keySlide),10); if(v>=0 && v<N) cur=v; }catch(e){}
  refresh(); fit();
  if(view==='book') go(cur);
}

/* ---------- 홈: 화면 전환 ---------- */
const homeEl=document.getElementById('home'), appEl=document.getElementById('app');
function show(v){
  if(view===v) return;
  view=v;
  homeEl.hidden = v!=='home';
  appEl.hidden = v!=='book';
  if(v==='book'){ fit(); go(cur); }
  else { if(dlg && !dlg.hidden) closeD(true); drawer(false); closeRes(); homeResize(); }
  applyMotion();
  homeLoop();
}
// 교과서를 펼쳐요. key는 슬라이드 키(p3 등), off는 그 Part 안에서 몇 번째 슬라이드인지
function enterBook(id, key, off, detail, fl){
  loadBook(id);
  show('book');
  if(key!=null && key in firstOf) go(firstOf[key]+(off||0));
  if(detail) openD(detail);
  if(location.hash!=='#'+B.hash) location.hash=B.hash;
  if(fl) setTimeout(()=>flashAt(fl),200);
}
// 검색에서 고른 것(Part 제목, 챕터 제목, 용어)을 다른 색으로 잠깐 반짝여요
function flashAt(fl){
  let el=null;
  if(fl==='part') el=els[cur].querySelector('h2.st');
  else if(fl==='lesson') el=document.getElementById('dlgT');
  else el=[...dlgB.querySelectorAll('.gl code')].find(c=>c.textContent===fl.term);
  clearTimeout(flashAt.t); document.querySelectorAll('.flash').forEach(e=>e.classList.remove('flash'));
  if(!el) return;
  void el.offsetWidth; el.classList.add('flash');
  flashAt.t=setTimeout(()=>el.classList.remove('flash'),2200);
}
// #book = 입문용, #novice = 초보자용, #mid = 중수용. 예전 링크(#p3 등)는 입문용 슬라이드로 열어요
const bookByHash = h => Object.values(BOOKDATA).find(b=>b.hash===h);
function routeHash(){
  const h=location.hash.slice(1), bk=bookByHash(h);
  if(bk){ loadBook(bk.id); show('book'); return; }
  if(/^(cover|ov|end|s\d+|p\d+)$/.test(h)){ loadBook('intro'); show('book'); go(firstOf[h]); return; }
  show('home');
}
addEventListener('hashchange',routeHash);
document.getElementById('homeBtn').addEventListener('click',()=>{ show('home'); location.hash='home'; });
document.getElementById('hModeBtn').addEventListener('click',()=> setMode(document.documentElement.getAttribute('data-mode')==='light'?'dark':'light', true));

/* ---------- 홈: 챕터·용어 검색 ---------- */
const IDX=[];
Object.values(BOOKDATA).forEach(bk=>{
  const seen=new Set();
  bk.parts.forEach((p,i)=>{
    if(!ready(p)) return;
    IDX.push({tg:`${bk.lv} P${pad(i)}`, tt:p.title, sb:`${bk.name} · 챕터 ${p.lessons.length}개`, hay:p.title+' '+p.short, go:()=>enterBook(bk.id,'p'+i,0,null,'part')});
    p.lessons.forEach((l,j)=>{
      const key=`${i}-${j+1}`;
      IDX.push({tg:`${bk.lv} ${key}`, tt:l[0], sb:l[1], hay:[l[0],l[1],...(l[2]||[])].join(' '), go:()=>enterBook(bk.id,'p'+i,1,key,'lesson')});
      ((bk.detail[key]||{}).t||[]).forEach(([term,r,m])=>{
        if(seen.has(term)) return; seen.add(term);
        const [og,rd]=r.includes('|')?r.split('|'):['',r];
        IDX.push({tg:`${bk.lv} 용어`, tt:term+(og?` · ${og}`:''), sb:m, hay:[term,og,rd].join(' '), go:()=>enterBook(bk.id,'p'+i,1,key,{term})});
      });
    });
  });
});
IDX.forEach(x=>{ x.lt=x.tt.toLowerCase(); x.lh=x.hay.toLowerCase(); });
const qIn=document.getElementById('q'), qRes=document.getElementById('qRes');
let hits=[], sel=0;
function closeRes(){ qRes.hidden=true; qIn.setAttribute('aria-expanded','false'); }
function renderRes(){
  const q=qIn.value.trim().toLowerCase();
  if(!q){ hits=[]; closeRes(); return; }
  hits=IDX.map(x=>({x, s: x.lt.startsWith(q)?0 : x.lt.includes(q)?1 : x.lh.includes(q)?2 : 9})).filter(o=>o.s<9).sort((a,b)=>a.s-b.s).slice(0,8).map(o=>o.x);
  sel=0;
  qRes.innerHTML = hits.length ? hits.map((x,k)=>`<li><button type="button" role="option" data-k="${k}"${k===sel?' class="on" aria-selected="true"':''}><span class="tg">${esc(x.tg)}</span><span><span class="tt">${esc(x.tt)}</span><span class="sb">${esc(x.sb)}</span></span></button></li>`).join('')
    : `<li class="none">‘${esc(qIn.value.trim())}’에 맞는 챕터나 용어가 없어요. 다른 낱말로 찾아보세요.</li>`;
  qRes.hidden=false; qIn.setAttribute('aria-expanded','true');
}
function moveSel(n){
  if(!hits.length) return;
  sel=(sel+n+hits.length)%hits.length;
  qRes.querySelectorAll('button').forEach((b,k)=>{ b.classList.toggle('on',k===sel); b.toggleAttribute('aria-selected',k===sel); if(k===sel) b.scrollIntoView({block:'nearest'}); });
}
qIn.addEventListener('input',renderRes);
qIn.addEventListener('focus',()=>{ if(qIn.value.trim()) renderRes(); });
qIn.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){ e.preventDefault(); moveSel(1); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); moveSel(-1); }
  else if(e.key==='Enter'){ e.preventDefault(); if(hits[sel]){ const h=hits[sel]; qIn.value=''; closeRes(); h.go(); } }
  else if(e.key==='Escape'){ if(qIn.value){ qIn.value=''; closeRes(); } else qIn.blur(); }
});
qRes.addEventListener('click',e=>{ const b=e.target.closest('button[data-k]'); if(!b) return; const h=hits[+b.dataset.k]; qIn.value=''; closeRes(); h.go(); });
document.addEventListener('click',e=>{ if(view==='home' && !e.target.closest('.srch')) closeRes(); });

/* ---------- 홈: 수준별 교과서 회전 ---------- */
const BOOKS=[
  {lv:'LV.1', nm:'입문', desc:'컴퓨터 용어부터 첫 배포까지 · 12 Part · 68 챕터', ready:true, book:'intro'},
  {lv:'LV.2', nm:'초보자', desc:'메모장 하나를 네 번 키우며 끝까지 만들어요 · 9 Part · 39 챕터', ready:true, book:'novice'},
  {lv:'LV.3', nm:'중수', desc:'메모장을 팀이 함께 쓰는 서비스로 키워요 · 10 Part · 44 챕터', ready:true, book:'mid'},
  {lv:'LV.4', nm:'전문가', desc:'팀과 함께 AI 개발 흐름을 운영해요'}
];
const BM=BOOKS.length, POOL=BM*2, STEP=27*Math.PI/180, SIZE=[1,.78,.63,.52];
const mod=(a,n)=>((a%n)+n)%n;
const orbsEl=document.getElementById('orbs'), capEl=document.getElementById('cap');
const orbEls=Array.from({length:POOL},(_,n)=>{
  const b=BOOKS[n%BM], e=document.createElement('button');
  e.type='button'; e.className='orb'+(b.ready?' ready':'');
  e.setAttribute('aria-label', `${b.nm}용 교과서${b.ready?' 열기':' (준비 중)'}`);
  e.innerHTML=`<span class="lv">${b.lv}</span><span class="nm">${b.nm}</span><span class="os">${b.ready?'열기':'준비 중'}</span>`;
  e.addEventListener('click',()=>{
    const rel=relOf(n);
    if(Math.abs(rel)<.5){ if(b.ready) enterBook(b.book); else { capEl.classList.remove('swap'); void capEl.offsetWidth; capEl.classList.add('swap'); } }
    else { target=Math.round(phase+rel); lastSwitch=performance.now(); }
  });
  e.addEventListener('pointerenter',()=>{ hold=true; });
  e.addEventListener('pointerleave',()=>{ hold=false; lastSwitch=performance.now(); });
  e.addEventListener('focus',()=>{ hold=true; });
  e.addEventListener('blur',()=>{ hold=false; lastSwitch=performance.now(); });
  orbsEl.appendChild(e); return e;
});
let phase=0, target=0, hold=false, lastSwitch=performance.now(), capFor=-1;
function relOf(n){ let r=mod(n-phase,POOL); if(r>=POOL/2) r-=POOL; return r; }
let reduce=false; try{ reduce=matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
function placeOrbs(){
  const W=homeEl.clientWidth, H=homeEl.clientHeight, cx=W/2, cy=H*1.08, R=H*.36, D=H*.2;
  orbEls.forEach((e,n)=>{
    const rel=relOf(n), a=Math.abs(rel), k=Math.min(a,3), f=Math.floor(k), sz=SIZE[f]+(SIZE[Math.min(f+1,3)]-SIZE[f])*(k-f);
    const ang=rel*STEP, x=cx+R*Math.sin(ang), y=cy-R*Math.cos(ang);
    const vis=a<2.6, op=Math.max(0,Math.min(1,(2.6-a)/.5))*(1-.26*Math.min(a,2));
    e.style.width=e.style.height=D+'px';
    e.style.transform=`translate(${x-D/2}px,${y-D/2}px) scale(${sz})`;
    e.style.opacity=op;
    e.style.filter=a<.05?'none':`blur(${Math.min(a*3.2,8).toFixed(2)}px)`;
    e.style.zIndex=10-Math.round(a*2);
    e.style.visibility=vis?'visible':'hidden';
    e.tabIndex=vis&&a<1.5?0:-1;
    e.classList.toggle('front',a<.5);
  });
  const fi=mod(Math.round(target),BM);
  if(fi!==capFor){
    capFor=fi; const b=BOOKS[fi];
    capEl.innerHTML=`<div class="t">${b.nm}용 · ${b.ready?BOOKDATA[b.book].name:'준비 중이에요'}</div><div class="d">${b.desc}</div><div class="dots">${BOOKS.map((_,k)=>`<i class="${k===fi?'on':''}"></i>`).join('')}</div>`;
    capEl.classList.remove('swap'); void capEl.offsetWidth; capEl.classList.add('swap');
  }
}

/* ---------- 홈: 색, 원자 도트, 배경 ---------- */
const hex=v=>{ v=v.trim().replace('#',''); if(v.length===3) v=[...v].map(c=>c+c).join(''); const n=parseInt(v,16); return [n>>16&255,n>>8&255,n&255]; };
let C={};
function homeColors(){
  const cs=getComputedStyle(document.documentElement);
  C={ac:hex(cs.getPropertyValue('--accent')), dot:hex(cs.getPropertyValue('--line-2')), ink:hex(cs.getPropertyValue('--muted')), light:document.documentElement.getAttribute('data-mode')==='light'};
  C.hi = C.light ? C.ac : hex(cs.getPropertyValue('--ink'));
}
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
const mix=(a,b,t)=>[0,1,2].map(i=>Math.round(a[i]+(b[i]-a[i])*t));
document.addEventListener('vc-mode',homeColors);

const dotCv=document.getElementById('dotCv'), dctx=dotCv.getContext('2d');
const bgCv=document.getElementById('bgCv'), bctx=bgCv.getContext('2d');
let atom=null, aW=0, aH=0, nodes=[], ptr={x:-1e4,y:-1e4};
function homeResize(){
  if(view!=='home') return;
  const dpr=Math.min(devicePixelRatio||1,2), W=homeEl.clientWidth, H=homeEl.clientHeight;
  bgCv.width=W*dpr; bgCv.height=H*dpr; bctx.setTransform(dpr,0,0,dpr,0,0);
  aW=dotCv.clientWidth; aH=dotCv.clientHeight;
  dotCv.width=aW*dpr; dotCv.height=aH*dpr; dctx.setTransform(dpr,0,0,dpr,0,0);
  buildAtom(H);
  const n=Math.round(Math.max(40,Math.min(115,W*H/16000)));
  nodes=Array.from({length:n},()=>({x:Math.random()*W, y:Math.random()*H, vx:(Math.random()-.5)*.25, vy:(Math.random()-.5)*.25, e:0}));
  placeOrbs();
}
homeEl.addEventListener('pointermove',e=>{ const b=dotCv.getBoundingClientRect(); ptr={x:e.clientX-b.left, y:e.clientY-b.top}; });
homeEl.addEventListener('pointerleave',()=>{ ptr={x:-1e4,y:-1e4}; });

/* 원자: 피보나치 구 위의 미세 도트(핵) + 기울어진 궤도 3개 + 궤도를 도는 전자.
   중심을 화면 맨 위에 두어 아래 절반만 보이고, 천천히 돌아요 */
const RINGS=[0,Math.PI/3,-Math.PI/3], TILT=.32;
function buildAtom(H){
  const R=H*.25, pts=[], N=3000;
  for(let i=0;i<N;i++){
    const y=1-2*(i+.5)/N, r=Math.sqrt(1-y*y), th=i*2.39996323;
    pts.push({ring:-1, x:Math.cos(th)*r, y, z:Math.sin(th)*r, ph:Math.random()*6.283, amp:.012+Math.random()*.04, sp:.8+Math.random()*1.8, s:0});
  }
  RINGS.forEach((_,k)=>{ for(let j=0;j<240;j++) pts.push({ring:k, a:j/240*6.283, ph:Math.random()*6.283, s:0}); });
  atom={R, Ro:R*1.45, cy:0, pts};
}
function ringPos(k,a,t){
  const r=atom.Ro, x=Math.cos(a)*r, z0=Math.sin(a)*r, y=-z0*Math.sin(TILT), z=z0*Math.cos(TILT), rz=RINGS[k]+t*.05;
  return [x*Math.cos(rz)-y*Math.sin(rz), x*Math.sin(rz)+y*Math.cos(rz), z];
}
function drawDots(t,dt){
  if(!atom) return;
  const cx=aW/2, cy=atom.cy, R=atom.R, f=R*8, glow=[];
  dctx.clearRect(0,0,aW,aH);
  if(reduce) t=0;
  const k1=Math.min(1,dt*12), k2=Math.min(1,dt*2.2);
  const ry=t*.2, cY=Math.cos(ry), sY=Math.sin(ry), tx=.4+Math.sin(t*.15)*.08, cX=Math.cos(tx), sX=Math.sin(tx);
  // 핵 안쪽의 은은한 빛
  const g=dctx.createRadialGradient(cx,cy,0,cx,cy,R*1.5);
  g.addColorStop(0,rgba(C.ac,.10+.04*Math.sin(t*1.6))); g.addColorStop(1,rgba(C.ac,0));
  dctx.fillStyle=g; dctx.fillRect(cx-R*1.5,cy-R*1.5,R*3,R*3);
  const proj=(x,y,z,p,dn,base)=>{
    const sc=f/(f-z); let X=cx+x*sc, Y=cy+y*sc;
    if(Y<-12){ p.s=0; return; }
    const md=Math.hypot(X-ptr.x,Y-ptr.y), tg=md<110?Math.pow(1-md/110,2):0;
    p.s+=(tg-p.s)*(tg>p.s?k1:k2);
    if(p.s>.01 && md>.5){ X+=(X-ptr.x)/md*p.s*14; Y+=(Y-ptr.y)/md*p.s*14; }
    const col=mix(mix(C.dot,C.ac,base+.45*dn),C.hi,p.s*.65);
    const a=Math.max((p.ring<0?.16:.1)+(p.ring<0?.72:.45)*dn, p.s);
    const rad=(p.ring<0?.45+.75*dn:.5+.45*dn)*(sc)+p.s*2.4;
    dctx.fillStyle=rgba(col,a.toFixed(3)); dctx.beginPath(); dctx.arc(X,Y,rad,0,6.283); dctx.fill();
    if(p.s>.04) glow.push([X,Y,p.s]);
  };
  for(const p of atom.pts){
    if(p.ring<0){
      const k=R*(1+p.amp*Math.sin(t*p.sp+p.ph));
      let x=p.x*k, y=p.y*k, z=p.z*k;
      [x,z]=[x*cY+z*sY, -x*sY+z*cY];
      [y,z]=[y*cX-z*sX, y*sX+z*cX];
      proj(x,y,z,p,(z/R+1)/2,.25);
    } else {
      const [x,y,z]=ringPos(p.ring,p.a+t*.15*(p.ring===1?-1:1),t);
      proj(x,y,z,p,(z/atom.Ro+1)/2,.35);
    }
  }
  // 전자: 궤도마다 하나, 꼬리를 남기며 돌아요
  RINGS.forEach((_,k)=>{
    const dir=k===1?-1:1, a0=t*.9*dir+k*2.1;
    for(let i=7;i>=0;i--){
      const [x,y,z]=ringPos(k,a0-dir*i*.07,t), sc=f/(f-z), X=cx+x*sc, Y=cy+y*sc, al=(1-i/8)*(.45+.4*(z/atom.Ro+1)/2);
      dctx.fillStyle=rgba(i?C.ac:mix(C.ac,C.hi,.5),al.toFixed(3)); dctx.beginPath(); dctx.arc(X,Y,(i?1.4:2.4)*sc*(1-i/12),0,6.283); dctx.fill();
      if(!i) glow.push([X,Y,.45]);
    }
  });
  // 호버한 도트는 더해지는 빛으로 밝게
  dctx.globalCompositeOperation=C.light?'source-over':'lighter';
  for(const [X,Y,s] of glow){
    dctx.fillStyle=rgba(C.ac,(s*(C.light?.10:.16)).toFixed(3)); dctx.beginPath(); dctx.arc(X,Y,3+s*10,0,6.283); dctx.fill();
    dctx.fillStyle=rgba(C.light?C.ac:mix(C.ac,C.hi,.5),(s*(C.light?.22:.38)).toFixed(3)); dctx.beginPath(); dctx.arc(X,Y,1.5+s*4,0,6.283); dctx.fill();
  }
  dctx.globalCompositeOperation='source-over';
}
function drawBg(t,dt){
  const W=homeEl.clientWidth, H=homeEl.clientHeight;
  bctx.clearRect(0,0,W,H);
  [[.18,.55,.0],[.82,.42,2.1],[.5,.62,4.2]].forEach(([fx,fy,o])=>{
    const x=W*fx+Math.sin(t*.07+o)*W*.06, y=H*fy+Math.cos(t*.05+o)*H*.06, r=Math.max(W,H)*.32;
    const gr=bctx.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,rgba(C.ac,(C.light?.05:.06)*(.75+.25*Math.sin(t*.4+o)))); gr.addColorStop(1,rgba(C.ac,0));
    bctx.fillStyle=gr; bctx.fillRect(0,0,W,H);
  });
  if(!reduce){
    for(const p of nodes){ p.x+=p.vx*dt*60; p.y+=p.vy*dt*60; if(p.x<-20)p.x=W+20; if(p.x>W+20)p.x=-20; if(p.y<-20)p.y=H+20; if(p.y>H+20)p.y=-20; p.e*=Math.exp(-dt*1.6); }
    if(Math.random()<dt*1.8) nodes[Math.floor(Math.random()*nodes.length)].e=1;
  }
  const L=140, base=C.light?.1:.095;
  bctx.lineWidth=1;
  for(let i=0;i<nodes.length;i++){ const a=nodes[i];
    for(let j=i+1;j<nodes.length;j++){ const b=nodes[j], dd=Math.hypot(a.x-b.x,a.y-b.y); if(dd>L) continue;
      const f=1-dd/L, e=Math.max(a.e,b.e);
      bctx.strokeStyle= e>.05 ? rgba(C.ac,f*(base+e*.34)) : rgba(C.ink,f*base);
      bctx.beginPath(); bctx.moveTo(a.x,a.y); bctx.lineTo(b.x,b.y); bctx.stroke();
    }
  }
  for(const p of nodes){
    if(p.e>.05){ bctx.fillStyle=rgba(C.ac,p.e*.16); bctx.beginPath(); bctx.arc(p.x,p.y,9,0,7); bctx.fill(); }
    bctx.fillStyle=p.e>.05?rgba(C.ac,.35+p.e*.55):rgba(C.ink,.4); bctx.beginPath(); bctx.arc(p.x,p.y,1.6,0,7); bctx.fill();
  }
}
let rafId=0, lastT=0;
function frame(now){
  rafId=0;
  if(view!=='home' || document.hidden) return;
  const dt=Math.min(.05,(now-(lastT||now))/1000); lastT=now;
  const busy=hold || !qRes.hidden || document.activeElement===qIn;
  if(!reduce && !busy && now-lastSwitch>4200){ target+=1; lastSwitch=now; }
  if(busy) lastSwitch=Math.max(lastSwitch,now-2000);
  phase = reduce ? target : phase+(target-phase)*(1-Math.exp(-dt*2.6));
  if(Math.abs(target-phase)<1e-3) phase=target;
  if(Math.abs(phase)>POOL*50){ const sh=Math.round(phase/POOL)*POOL; phase-=sh; target-=sh; }
  placeOrbs(); drawDots(now/1000,dt); drawBg(now/1000,dt);
  rafId=requestAnimationFrame(frame);
}
function homeLoop(){ if(view==='home' && !rafId){ lastT=0; rafId=requestAnimationFrame(frame); } }
document.addEventListener('visibilitychange',homeLoop);
if('ResizeObserver' in window) new ResizeObserver(homeResize).observe(homeEl); else addEventListener('resize',homeResize);

document.addEventListener('keydown',e=>{
  if(view!=='home' || e.altKey||e.ctrlKey||e.metaKey) return;
  if(e.target===qIn) return;
  if(e.key==='/'){ e.preventDefault(); qIn.focus(); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); target=Math.round(target)+1; lastSwitch=performance.now(); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); target=Math.round(target)-1; lastSwitch=performance.now(); }
});
homeColors();

loadBook((bookByHash(location.hash.slice(1))||BOOKDATA.intro).id);
routeHash();
</script>
