# 검색 위젯 '바이브 코딩 사전'의 Windows · Mac 설치 파일을 만들어 Releases에 올려요.
# desktop/ 이 바뀌어 올라오면 자동으로 돌고, Actions 탭에서 직접 돌릴 수도 있어요.
# 버전은 desktop/package.json의 version을 따라요(같은 버전이면 파일만 새로 바꿔 올려요).
name: 위젯 설치 파일

on:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win --x64
          - os: macos-latest
            args: --mac --x64 --arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Releases에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          V=$(node -p "require('./desktop/package.json').version")
          TAG="widget-v$V"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "바이브 코딩 사전 $V" --notes-file desktop/RELEASE_NOTES.md --latest
          fi
