<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>바이브 코딩 사전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 바이브 코딩 사전: 교과서 네 권의 용어 · 챕터를 찾는 작은 검색 위젯. 데스크톱 앱(Electron) 창과 브라우저 양쪽에서 쓴다 */
:root{
  --bg:#090B0A; --surface:#161C1A; --line:#2E3834; --line-2:#4A5852; --chip:#212A27;
  --ink:#E8EEEB; --ink-2:#CDD7D2; --muted:#9DAAA4;
  --accent:#3DDBA6; --accent-soft:rgba(61,219,166,.14); --mark:rgba(61,219,166,.26);
  --shadow:0 16px 48px rgba(0,0,0,.45); --pop-shadow:0 8px 24px rgba(0,0,0,.5);
  --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono','IBM Plex Sans KR',ui-monospace,'SFMono-Regular',Consolas,monospace;
  color-scheme:dark;
}
/* 화면 모드: data-mode가 없으면 컴퓨터 설정을 따르고, light · dark면 그대로 */
@media (prefers-color-scheme: light){
  :root:not([data-mode="dark"]){
    --bg:#E9EEEC; --surface:#FFFFFF; --line:#D3DCD8; --line-2:#A9B7B1; --chip:#E7EDEA;
    --ink:#0F1614; --ink-2:#2B3833; --muted:#55645E;
    --accent:#0A8A5F; --accent-soft:rgba(10,138,95,.11); --mark:rgba(10,138,95,.2);
    --shadow:0 12px 36px rgba(20,40,32,.14); --pop-shadow:0 8px 24px rgba(20,40,32,.18);
    color-scheme:light;
  }
}
:root[data-mode="light"]{
    --bg:#E9EEEC; --surface:#FFFFFF; --line:#D3DCD8; --line-2:#A9B7B1; --chip:#E7EDEA;
    --ink:#0F1614; --ink-2:#2B3833; --muted:#55645E;
    --accent:#0A8A5F; --accent-soft:rgba(10,138,95,.11); --mark:rgba(10,138,95,.2);
    --shadow:0 12px 36px rgba(20,40,32,.14); --pop-shadow:0 8px 24px rgba(20,40,32,.18);
    color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 14px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}

.card{display:flex;flex-direction:column;width:min(560px,100% - 32px);height:min(560px,100vh - 64px);margin:32px auto;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
/* 앱에서는 창 자체가 카드예요. 둥근 모서리와 그림자는 운영체제가 그려 줘요 */
html.app body{background:var(--surface)}
html.app .card{width:auto;height:auto;position:fixed;inset:0;margin:0;border:0;border-radius:0;box-shadow:none}

.top{display:flex;align-items:center;gap:8px;padding:12px 16px 0;-webkit-app-region:drag;user-select:none}
.top .nm{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.top .nm b{color:var(--accent);font-weight:600}
.top .ib{display:grid;place-items:center;width:24px;height:24px;border:0;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;-webkit-app-region:no-drag}
.top .md{margin-left:auto;display:flex;align-items:center;gap:4px;width:auto;padding:0 8px;font:500 11px var(--f-body)}
.top .x{display:none}
html.app .top .x{display:grid}
.top .ib:hover{background:var(--chip);color:var(--ink)}
.top .ib svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.sbox{display:flex;align-items:center;gap:8px;margin:12px 16px 0;padding:0 12px;height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--bg)}
.sbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sbox svg{width:18px;height:18px;flex:none;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.sbox input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:500 16px var(--f-body)}
.sbox input::placeholder{color:var(--muted);font-weight:400}
.sbox input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}

.tabs{display:flex;gap:4px;margin:12px 16px 0}
.tabs button{border:1px solid transparent;border-radius:999px;background:transparent;color:var(--muted);font:500 12px var(--f-body);padding:4px 12px;cursor:pointer}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.tabs .n{margin-left:4px;font:400 11px var(--f-mono);opacity:.8}

.res{flex:1;overflow:auto;margin:8px 0 0;padding:0 8px 8px;list-style:none;scrollbar-width:thin}
.res li{padding:12px;border-radius:10px;cursor:default}
.res li + li{margin-top:2px}
.res li.on{background:var(--chip)}
.res .h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.res .w{font-size:15px;font-weight:600;color:var(--ink)}
.res .o{font:400 12px var(--f-mono);color:var(--muted)}
.res .r{font-size:12px;color:var(--accent)}
.res .k{font:500 11px var(--f-body);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px}
.res .m{margin-top:4px;color:var(--ink-2)}
.res .k.s{color:var(--accent);border-color:var(--accent)}
.res .at{margin-top:4px;font-size:12px;color:var(--muted)}
.res .at b{font-weight:500;color:var(--ink-2)}
.res mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.res .m .tl,.pop .tl{display:inline;border:0;padding:0;margin:0;background:none;font:inherit;color:inherit;cursor:pointer;
  text-decoration:underline dotted;text-decoration-color:var(--line-2);text-underline-offset:3px}
.res .m .tl:hover,.pop .tl:hover,.tl.on{color:var(--accent);text-decoration-color:var(--accent)}
/* 말풍선: 뜻풀이 속 사전 용어를 누르면 그 용어의 뜻을 보여 줘요 */
.pop{position:fixed;z-index:10;width:max-content;max-width:min(320px,100vw - 24px);max-height:calc(100vh - 24px);overflow:auto;
  padding:12px;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--pop-shadow);
  font-size:13px;-webkit-app-region:no-drag;scrollbar-width:thin}
.pop .pe + .pe{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.pop .h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.pop .w{font-size:14px;font-weight:600;color:var(--ink)}
.pop .o{font:400 11px var(--f-mono);color:var(--muted)}
.pop .r{font-size:11px;color:var(--accent)}
.pop .m{margin-top:4px;color:var(--ink-2)}
.pop .at{margin-top:4px;font-size:11px;color:var(--muted)}
.pop .at b{font-weight:500;color:var(--ink-2)}
.empty{padding:24px 16px;color:var(--muted);font-size:13px;text-align:center}
.empty b{color:var(--ink-2);font-weight:500}

.foot{display:flex;gap:16px;justify-content:center;padding:8px 16px 12px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.foot a{color:var(--accent);text-decoration:none}
.foot a:hover{text-decoration:underline}
.foot kbd{font:500 11px var(--f-mono);color:var(--ink-2);border:1px solid var(--line-2);border-radius:4px;padding:0 4px}
</style>
</head>
<body>
<main class="card" role="search">
  <div class="top">
    <span class="nm"><b>바이브 코딩</b> 사전</span>
    <button class="ib md" type="button" id="mode"></button>
    <button class="ib x" type="button" id="hide" aria-label="닫기" title="닫기 (Esc)"><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
  </div>
  <label class="sbox"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
    <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="용어 · 챕터 · 해결법을 입력하세요" aria-label="용어, 챕터, 해결법 검색" aria-controls="res" autofocus></label>
  <div class="tabs" role="tablist" id="tabs">
    <button type="button" data-k="" class="on">모두<span class="n" id="n0"></span></button>
    <button type="button" data-k="t">용어<span class="n" id="nt"></span></button>
    <button type="button" data-k="c">챕터<span class="n" id="nc"></span></button>
    <button type="button" data-k="s">해결법<span class="n" id="ns"></span></button>
  </div>
  <ul class="res" id="res" role="listbox" aria-label="검색 결과"></ul>
  <div class="pop" id="pop" role="dialog" aria-label="용어 뜻" hidden></div>
  <div class="foot"><span><kbd>↑</kbd> <kbd>↓</kbd> 고르기</span><span><kbd>Esc</kbd> 지우기 · 닫기</span><span id="hk"></span></div>
</main>
<script>
const isApp = !!window.vibe;
if (isApp) document.documentElement.classList.add('app');
const $ = id => document.getElementById(id);
const qIn = $('q'), resEl = $('res');
let DATA = null, kind = '', hits = [], sel = 0;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').toLowerCase().replace(/\s+/g, '');
function hl(text, q){
  const t = String(text ?? ''), i = q ? t.toLowerCase().indexOf(q) : -1;
  return i < 0 ? esc(t) : esc(t.slice(0, i)) + '<mark>' + esc(t.slice(i, i + q.length)) + '</mark>' + esc(t.slice(i + q.length));
}

/* 뜻풀이 속 사전 용어: 이름(· 로 나뉜 것은 하나씩)을 찾아 누를 수 있게 만들어요 */
const TERMS = new Map();
let TRE = null;
function prepTerms(items){
  items.filter(x => x.k === 't').forEach(x => {
    const names = new Set([x.w, x.w.replace(/\s*\([^)]*\)\s*$/, ''), ...x.w.split(/\s*·\s*/)]);
    names.forEach(n => {
      n = n.trim();
      if ([...n].length < 2 || !/[A-Za-z가-힣]/.test(n)) return; // 한 글자 · 숫자뿐인 이름은 빼요
      const k = n.toLowerCase();
      if (!TERMS.has(k)) TERMS.set(k, []);
      if (!TERMS.get(k).includes(x)) TERMS.get(k).push(x);
    });
  });
  const keys = [...TERMS.keys()].sort((a, b) => b.length - a.length).map(k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  TRE = keys.length ? new RegExp(keys.join('|'), 'gi') : null;
}
function linkify(text, self){
  const t = String(text ?? '');
  if (!TRE) return esc(t);
  let out = '', last = 0; const seen = new Set();
  for (const m of t.matchAll(TRE)){
    const s = m.index, e = s + m[0].length, k = m[0].toLowerCase();
    if (/[가-힣A-Za-z0-9_]/.test(t[s - 1] || '')) continue;                  // 낱말 중간(스트리밍 속 '트리')은 빼요
    if (/[A-Za-z0-9]$/.test(m[0]) && /[A-Za-z0-9_]/.test(t[e] || '')) continue;
    if (seen.has(k) || !(TERMS.get(k) || []).some(x => x !== self)) continue;
    seen.add(k);
    out += esc(t.slice(last, s)) + `<button type="button" class="tl" tabindex="-1" data-t="${esc(k)}">${esc(m[0])}</button>`;
    last = e;
  }
  return out + esc(t.slice(last));
}

function prep(data){
  prepTerms(data.items);
  data.items.forEach(x => {
    x.nw = norm(x.w);
    x.no = norm([x.o, x.r].join(' '));
    x.alt = [norm(x.o), norm(x.r)].filter(Boolean);
    x.nm = norm([x.m, ...(x.tags || [])].join(' '));
  });
  return data;
}

function score(x, q){
  if (x.nw === q) return 0;
  if (x.nw.startsWith(q) || x.alt.includes(q)) return 1;
  if (x.nw.includes(q)) return 2;
  if (x.no.includes(q)) return 3;
  if (x.nm.includes(q)) return 4;
  return 9;
}
const ORDER = { t: 0, c: 1, p: 2, s: 3 };
// 탭: t 용어, c 챕터(Part 포함), s 해결법(실습 슬라이드의 ‘막혔을 때’)
const KIND_OF = x => (x.k === 'p' ? 'c' : x.k);
const KIND_NAME = { '': '용어나 챕터, 해결법이', t: '용어가', c: '챕터가', s: '해결법이' };

function render(){
  closePop();
  const raw = qIn.value.trim(), q = norm(raw);
  if (!DATA){ resEl.innerHTML = `<li class="empty">교과서 내용을 불러오는 중이에요…</li>`; return; }
  if (!q){
    hits = []; ['n0','nt','nc','ns'].forEach(id => $(id).textContent = '');
    resEl.innerHTML = `<li class="empty">교과서 네 권과 용어 사전의 <b>용어 ${DATA.items.filter(x=>x.k==='t').length}개</b>, <b>챕터 ${DATA.items.filter(x=>x.k==='c').length}개</b>, <b>해결법 ${DATA.items.filter(x=>x.k==='s').length}개</b>에서 찾아요.<br>예: RLS, 배포, worktree, 커밋, 로그인${isApp ? '<br><br>컴퓨터를 켜면 뒤에서 조용히 기다려요.<br><b>\\ 세 번</b>으로 열고, <b>\\ 두 번</b>으로 닫아요.' : ''}</li>`;
    return;
  }
  const all = DATA.items.map(x => ({ x, s: score(x, q) })).filter(o => o.s < 9)
    .sort((a, b) => a.s - b.s || ORDER[a.x.k] - ORDER[b.x.k] || (a.x.b === 'dict') - (b.x.b === 'dict') || a.x.w.length - b.x.w.length);
  $('n0').textContent = all.length;
  $('nt').textContent = all.filter(o => o.x.k === 't').length;
  $('nc').textContent = all.filter(o => KIND_OF(o.x) === 'c').length;
  $('ns').textContent = all.filter(o => o.x.k === 's').length;
  hits = all.filter(o => !kind || KIND_OF(o.x) === kind).slice(0, 40).map(o => o.x);
  sel = 0;
  if (!hits.length){ resEl.innerHTML = `<li class="empty">‘${esc(raw)}’에 맞는 ${KIND_NAME[kind]} 없어요. 다른 낱말로 찾아보세요.</li>`; return; }
  const ql = raw.toLowerCase();
  resEl.innerHTML = hits.map((x, i) => {
    const book = DATA.books[x.b] || x.b;
    const head = x.k === 't'
      ? `<span class="w">${hl(x.w, ql)}</span>${x.o ? `<span class="o">${esc(x.o)}</span>` : ''}${x.r ? `<span class="r">[${esc(x.r)}]</span>` : ''}`
      : `<span class="k${x.k === 's' ? ' s' : ''}">${x.k === 'p' ? 'Part' : x.k === 's' ? '해결법' : '챕터'}</span><span class="w">${hl(x.w, ql)}</span>`;
    return `<li role="option" id="o${i}"${i === sel ? ' class="on" aria-selected="true"' : ''}><div class="h">${head}</div><div class="m">${linkify(x.m, x)}</div><div class="at"><b>${esc(book)}</b> · ${esc(x.at)}</div></li>`;
  }).join('');
  resEl.scrollTop = 0;
}

function move(n, scroll = true){
  if (!hits.length) return;
  sel = (sel + n + hits.length) % hits.length;
  resEl.querySelectorAll('li[role=option]').forEach((li, i) => { li.classList.toggle('on', i === sel); li.toggleAttribute('aria-selected', i === sel); if (i === sel && scroll) li.scrollIntoView({ block: 'nearest' }); });
}

// \ 키는 창을 여닫는 단축키라 입력 칸에 들어온 \ · ₩는 지워요
qIn.addEventListener('input', () => {
  if (/[\\₩]/.test(qIn.value)) qIn.value = qIn.value.replace(/[\\₩]/g, '');
  render();
});
qIn.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown'){ e.preventDefault(); move(1); }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); move(-1); }
  else if (e.key === 'Escape'){ e.preventDefault(); if (!pop.hidden) closePop(); else if (qIn.value){ qIn.value = ''; render(); } else if (isApp) window.vibe.hide(); }
});
resEl.addEventListener('mousemove', e => { const li = e.target.closest('li[role=option]'); if (!li) return; const i = +li.id.slice(1); if (i !== sel){ sel = i; move(0, false); } }); // 마우스를 올려도 목록은 움직이지 않아요
/* 말풍선 */
const pop = $('pop');
let popAnchor = null;
function closePop(){
  if (pop.hidden) return;
  pop.hidden = true; pop.innerHTML = '';
  if (popAnchor) popAnchor.classList.remove('on');
  popAnchor = null;
}
function openPop(anchor, key){
  const list = TERMS.get(key) || [];
  if (!list.length) return;
  if (popAnchor && popAnchor !== anchor) popAnchor.classList.remove('on');
  popAnchor = anchor; anchor.classList.add('on');
  pop.innerHTML = list.slice(0, 3).map(x => `<div class="pe"><div class="h"><span class="w">${esc(x.w)}</span>${x.o ? `<span class="o">${esc(x.o)}</span>` : ''}${x.r ? `<span class="r">[${esc(x.r)}]</span>` : ''}</div><div class="m">${linkify(x.m, x)}</div><div class="at"><b>${esc(DATA.books[x.b] || x.b)}</b> · ${esc(x.at)}</div></div>`).join('');
  pop.hidden = false; pop.scrollTop = 0;
  const r = anchor.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
  const left = Math.max(12, Math.min(r.left + r.width / 2 - pw / 2, innerWidth - 12 - pw));
  let top = r.bottom + 6;
  if (top + ph > innerHeight - 12) top = Math.max(12, r.top - 6 - ph);
  pop.style.left = left + 'px'; pop.style.top = top + 'px';
}
// 누를 때 입력 칸의 포커스를 빼앗지 않아요(바로 이어서 입력할 수 있게)
document.addEventListener('mousedown', e => {
  if (e.target.closest('.tl')) { e.preventDefault(); return; }
  if (!e.target.closest('#pop')) closePop();
});
document.addEventListener('click', e => {
  const b = e.target.closest('.tl'); if (!b) return;
  // 말풍선 안의 용어를 누르면 같은 자리에서 그 용어로 바꿔 보여 줘요
  if (b.closest('#pop')) openPop(popAnchor, b.dataset.t);
  else if (b === popAnchor) closePop();
  else openPop(b, b.dataset.t);
});
resEl.addEventListener('scroll', closePop);
addEventListener('resize', closePop);

$('tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-k]'); if (!b) return;
  kind = b.dataset.k; $('tabs').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  render(); qIn.focus();
});
$('hide').addEventListener('click', () => window.vibe && window.vibe.hide());

/* 화면 모드: 시스템 → 라이트 → 다크 순서로 바꿔요. 앱에서는 앱 설정에, 브라우저에서는 이 브라우저에 저장해요 */
const MODES = {
  system: ['시스템', '<svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="8" rx="1.5"/><path d="M6 14h4M8 11v3"/></svg>'],
  light: ['라이트', '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1"/></svg>'],
  dark: ['다크', '<svg viewBox="0 0 16 16"><path d="M13 9.5A5.5 5.5 0 1 1 6.5 3a4.5 4.5 0 0 0 6.5 6.5z"/></svg>']
};
const NEXT = { system: 'light', light: 'dark', dark: 'system' };
let mode = 'system';
function applyMode(m){
  mode = MODES[m] ? m : 'system';
  if (mode === 'system') delete document.documentElement.dataset.mode; else document.documentElement.dataset.mode = mode;
  const [label, icon] = MODES[mode];
  $('mode').innerHTML = icon + label;
  $('mode').title = `화면 모드: ${label} (눌러서 바꾸기)`;
  $('mode').setAttribute('aria-label', `화면 모드 ${label}, 눌러서 바꾸기`);
}
$('mode').addEventListener('click', () => {
  applyMode(NEXT[mode]);
  if (isApp) window.vibe.setMode(mode); else { try { localStorage.setItem('vibe-dict-mode', mode); } catch {} }
  qIn.focus();
});
if (isApp) window.vibe.getMode().then(applyMode);
else { let m = 'system'; try { m = localStorage.getItem('vibe-dict-mode') || 'system'; } catch {} applyMode(m); }

const DOWNLOAD = 'https://github.com/hashinaoffice-hue/vibe-coding-textbook/releases/latest';
if (!isApp) $('hk').innerHTML = `<a href="${DOWNLOAD}" target="_blank" rel="noopener">데스크톱 앱 내려받기</a>`;
if (isApp){
  $('hk').innerHTML = '<kbd>\\</kbd> 두 번 닫기';
  window.vibe.onShow(() => { closePop(); qIn.focus(); qIn.select(); });
}

(async () => {
  try {
    DATA = prep(isApp ? await window.vibe.getIndex() : await (await fetch('search.json', { cache: 'no-cache' })).json());
  } catch (err) {
    resEl.innerHTML = `<li class="empty">교과서 내용을 불러오지 못했어요. 인터넷 연결을 확인한 뒤 다시 열어 주세요.</li>`;
    return;
  }
  render();
})();
render();
</script>
</body>
</html>
